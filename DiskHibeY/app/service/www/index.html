<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DiskHibeY · 硬盘休眠</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%233370ff'/%3E%3Cpath d='M44 34.5A12.5 12.5 0 1 1 29.5 20 10 10 0 0 0 44 34.5z' fill='%23fff' transform='translate(2,2)'/%3E%3C/svg%3E">
<style>
:root {
  --primary: #3370ff;
  --primary-2: #1f5cff;
  --primary-weak: rgba(51, 112, 255, .09);
  --bg: #f3f5f9;
  --bg-2: #e9edf4;
  --card: #ffffff;
  --text: #1f2329;
  --muted: #8a93a6;
  --border: #e6eaf2;
  --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 10px 28px rgba(16, 24, 40, .06);
  --shadow-hover: 0 2px 4px rgba(16, 24, 40, .05), 0 16px 36px rgba(16, 24, 40, .10);
  --ok: #00b577;
  --ok-bg: rgba(0, 181, 119, .12);
  --st: #3370ff;
  --st-bg: rgba(51, 112, 255, .12);
  --sl: #7a5af8;
  --sl-bg: rgba(122, 90, 248, .12);
  --uk: #8a93a6;
  --uk-bg: rgba(138, 147, 166, .14);
  --er: #ff8800;
  --er-bg: rgba(255, 136, 0, .12);
  --warn: #e6a23c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1318;
    --bg-2: #12171e;
    --card: #171c24;
    --text: #e8ecf2;
    --muted: #7d8797;
    --border: #232b36;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 12px 32px rgba(0, 0, 0, .35);
    --shadow-hover: 0 2px 6px rgba(0, 0, 0, .35), 0 18px 44px rgba(0, 0, 0, .45);
    --ok-bg: rgba(0, 181, 119, .16);
    --st-bg: rgba(51, 112, 255, .18);
    --sl-bg: rgba(122, 90, 248, .16);
    --uk-bg: rgba(138, 147, 166, .18);
    --er-bg: rgba(255, 136, 0, .16);
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  background: linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
  background-attachment: fixed;
  color: var(--text);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1240px; margin: 0 auto; padding: 28px 24px 40px; }

/* ---------- 顶栏 ---------- */
header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 14px; }
.logo {
  width: 46px; height: 46px; border-radius: 13px; flex: none;
  background: linear-gradient(135deg, #4d8bff 0%, #1f5cff 60%, #173fff 100%);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 6px 16px rgba(51, 112, 255, .35);
}
.logo svg { width: 26px; height: 26px; }
.brand h1 { font-size: 21px; font-weight: 700; letter-spacing: .2px; }
.title-row { display: flex; align-items: center; gap: 9px; }
.ver {
  font-size: 11px; font-weight: 700; color: var(--primary);
  background: var(--primary-weak); border-radius: 6px; padding: 2px 8px;
  letter-spacing: .4px; font-family: ui-monospace, "SF Mono", Consolas, Menlo, monospace;
}
.brand .sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.head-actions { display: flex; align-items: center; gap: 14px; }
.updated { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.btn {
  border: 1px solid var(--border); background: var(--card); color: var(--text);
  font-size: 13.5px; font-weight: 600; padding: 9px 18px; border-radius: 10px;
  cursor: pointer; display: inline-flex; align-items: center; gap: 7px;
  transition: all .2s ease; box-shadow: var(--shadow);
  font-family: inherit;
}
.btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-hover); border-color: var(--primary); color: var(--primary); }
.btn:active { transform: translateY(0); }
.btn svg { width: 15px; height: 15px; }
.btn.spinning svg { animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- 概览 ---------- */
.summary { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
.chip {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 7px 14px; border-radius: 999px; font-size: 12.5px; font-weight: 600;
  background: var(--card); border: 1px solid var(--border); color: var(--muted);
}
.chip b { color: var(--text); font-size: 13.5px; }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; }
.dot-ok { background: var(--ok); }
.dot-st { background: var(--st); }
.dot-all { background: var(--primary); }

/* ---------- 横幅 ---------- */
.banner {
  display: flex; align-items: center; gap: 10px;
  background: var(--er-bg); border: 1px solid rgba(255, 136, 0, .35);
  color: var(--er); border-radius: 12px; padding: 12px 16px;
  font-size: 13.5px; margin-bottom: 18px;
}
.banner svg { width: 17px; height: 17px; flex: none; }

/* ---------- 卡片网格 ---------- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(345px, 1fr)); gap: 16px; }
.card {
  background: var(--card); border: 1px solid var(--border); border-radius: 16px;
  padding: 20px 20px 18px; box-shadow: var(--shadow);
  display: flex; flex-direction: column; gap: 14px;
  transition: transform .22s ease, box-shadow .22s ease;
  animation: cardIn .4s ease both;
}
.card:hover { transform: translateY(-3px); box-shadow: var(--shadow-hover); }
@keyframes cardIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.card-head { display: flex; align-items: flex-start; gap: 13px; }
.disk-icon {
  width: 42px; height: 42px; border-radius: 12px; flex: none;
  display: flex; align-items: center; justify-content: center;
  background: var(--primary-weak); transition: background .3s ease;
}
.disk-icon svg { width: 22px; height: 22px; stroke: var(--primary); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.disk-icon.s-active { background: var(--ok-bg); }   .disk-icon.s-active svg { stroke: var(--ok); }
.disk-icon.s-standby { background: var(--st-bg); }  .disk-icon.s-standby svg { stroke: var(--st); }
.disk-icon.s-sleeping { background: var(--sl-bg); } .disk-icon.s-sleeping svg { stroke: var(--sl); }
.disk-icon.s-idle { background: rgba(14, 165, 164, .12); } .disk-icon.s-idle svg { stroke: #0ea5a4; }
.disk-icon.s-unknown, .disk-icon.s-error { background: var(--uk-bg); }
.disk-icon.s-unknown svg, .disk-icon.s-error svg { stroke: var(--uk); }

.disk-title { flex: 1; min-width: 0; }
.model { font-size: 15.5px; font-weight: 700; word-break: break-all; line-height: 1.35; }
.model-sub { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; margin-top: 3px; font-size: 12px; color: var(--muted); }
.mono { font-family: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, Menlo, monospace; }
.tag {
  display: inline-flex; align-items: center; padding: 1.5px 8px; border-radius: 6px;
  font-size: 11px; font-weight: 600; letter-spacing: .3px;
  background: var(--uk-bg); color: var(--muted);
}
.tag-blue { background: var(--st-bg); color: var(--primary); }
.tag-warn { background: var(--er-bg); color: var(--er); }

.pill {
  display: inline-flex; align-items: center; gap: 6px; flex: none;
  padding: 4px 11px; border-radius: 999px; font-size: 12px; font-weight: 700;
}
.pill .dot { width: 7px; height: 7px; border-radius: 50%; position: relative; }
.pill.p-active { background: var(--ok-bg); color: var(--ok); }
.pill.p-active .dot { background: var(--ok); animation: pulse 2s ease infinite; }
.pill.p-standby { background: var(--st-bg); color: var(--st); }
.pill.p-standby .dot { background: var(--st); box-shadow: 0 0 0 0 rgba(51,112,255,.5); animation: glow 2.4s ease infinite; }
.pill.p-sleeping { background: var(--sl-bg); color: var(--sl); }
.pill.p-sleeping .dot { background: var(--sl); }
.pill.p-unknown { background: var(--uk-bg); color: var(--uk); }
.pill.p-unknown .dot { background: var(--uk); }
.pill.p-error { background: var(--er-bg); color: var(--er); }
.pill.p-error .dot { background: var(--er); }
.pill.p-idle { background: rgba(14, 165, 164, .12); color: #0ea5a4; }
.pill.p-idle .dot { background: #0ea5a4; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
@keyframes glow {
  0% { box-shadow: 0 0 0 0 rgba(51, 112, 255, .45); }
  70% { box-shadow: 0 0 0 7px rgba(51, 112, 255, 0); }
  100% { box-shadow: 0 0 0 0 rgba(51, 112, 255, 0); }
}

/* ---------- 参数区 ---------- */
.specs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
.spec { background: var(--bg); border-radius: 10px; padding: 9px 12px; min-width: 0; }
.spec .k { font-size: 11.5px; color: var(--muted); margin-bottom: 2px; }
.spec .v { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.spec.full { grid-column: 1 / -1; }
.mounts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.mount {
  font-family: ui-monospace, "SF Mono", Consolas, Menlo, monospace;
  font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 6px;
  background: var(--primary-weak); color: var(--primary);
  max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

/* ---------- 状态详情 / 错误 ---------- */
.detail {
  font-size: 12.5px; color: var(--er); background: var(--er-bg);
  border-radius: 10px; padding: 9px 12px; word-break: break-all; line-height: 1.55;
}

/* ---------- 休眠按钮 ---------- */
.btn-sleep {
  margin-top: auto; border: none; cursor: pointer; font-family: inherit;
  background: linear-gradient(135deg, #4d8bff 0%, #1f5cff 100%);
  color: #fff; font-size: 14px; font-weight: 700; letter-spacing: .5px;
  padding: 11px 0; border-radius: 11px; width: 100%;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  box-shadow: 0 6px 16px rgba(51, 112, 255, .28);
  transition: all .2s ease;
}
.btn-sleep svg { width: 16px; height: 16px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.btn-sleep:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 10px 22px rgba(51, 112, 255, .38); filter: brightness(1.05); }
.btn-sleep:active:not(:disabled) { transform: translateY(0); }
.btn-sleep:disabled { background: var(--uk-bg); color: var(--muted); box-shadow: none; cursor: default; }
.btn-sleep.loading { opacity: .85; cursor: wait; }
.spinner {
  width: 15px; height: 15px; border-radius: 50%;
  border: 2px solid rgba(255, 255, 255, .35); border-top-color: #fff;
  animation: spin .8s linear infinite;
}

/* ---------- 空状态 / 骨架屏 ---------- */
.empty {
  grid-column: 1 / -1; text-align: center; color: var(--muted);
  padding: 70px 20px; background: var(--card); border: 1px dashed var(--border); border-radius: 16px;
}
.empty svg { width: 44px; height: 44px; stroke: var(--muted); fill: none; stroke-width: 1.6; margin-bottom: 12px; opacity: .7; }
.skeleton {
  height: 218px; border-radius: 16px; background: var(--card); border: 1px solid var(--border);
  position: relative; overflow: hidden;
}
.skeleton::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent 0%, rgba(138, 147, 166, .10) 50%, transparent 100%);
  animation: shimmer 1.4s infinite;
}
@keyframes shimmer { from { transform: translateX(-100%); } to { transform: translateX(100%); } }

/* ---------- 页脚 ---------- */
footer {
  margin-top: 30px; text-align: center; font-size: 12px; color: var(--muted); line-height: 1.9;
}
footer .divider { margin: 0 8px; opacity: .5; }

/* ---------- Toast ---------- */
#toast {
  position: fixed; left: 50%; bottom: 34px; transform: translateX(-50%) translateY(24px);
  max-width: min(560px, calc(100vw - 48px));
  background: var(--card); color: var(--text); border: 1px solid var(--border);
  border-radius: 12px; padding: 12px 18px; font-size: 13.5px; font-weight: 600;
  box-shadow: 0 12px 40px rgba(16, 24, 40, .22);
  display: flex; align-items: center; gap: 9px;
  opacity: 0; pointer-events: none; transition: all .3s cubic-bezier(.2, .8, .3, 1.1); z-index: 99;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#toast .t-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
#toast.t-success .t-dot { background: var(--ok); }
#toast.t-error .t-dot { background: #e5484d; }
#toast.t-info .t-dot { background: var(--primary); }

@media (max-width: 640px) {
  .wrap { padding: 20px 14px 30px; }
  .grid { grid-template-columns: 1fr; }
  .brand h1 { font-size: 18px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none"><path d="M21.5 12.9A9.6 9.6 0 1 1 11 2.3a7.5 7.5 0 0 0 10.5 10.6z" fill="#fff"/></svg>
      </div>
      <div>
        <div class="title-row">
          <h1>DiskHibeY</h1>
          <span class="ver" id="verBadge">V0.0.2</span>
        </div>
        <div class="sub">硬盘休眠管理 · DiskHibernation in fnOS for YYHome</div>
      </div>
    </div>
    <div class="head-actions">
      <span class="updated" id="updated"></span>
      <button class="btn" id="refreshBtn" onclick="refresh()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        刷新状态
      </button>
    </div>
  </header>

  <div class="summary" id="summary"></div>
  <div class="banner" id="errorBanner" style="display:none">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    <span id="errorText"></span>
  </div>

  <div class="grid" id="grid"></div>

  <footer>
    <span id="verFooter">DiskHibeY V0.0.2</span><span class="divider">·</span>仅执行一次性 hdparm -y 休眠指令，不修改 fnOS 系统的自动休眠设置<span class="divider">·</span>状态通过 hdparm -C 查询
    <br>部分 USB 桥接芯片不支持状态查询，或会在查询时唤醒硬盘，属正常现象；状态显示"未知"的硬盘通常仍可正常休眠
  </footer>
</div>

<div id="toast"><span class="t-dot"></span><span id="toastText"></span></div>

<script>
"use strict";

var DISKS = [];
var BUSY = {};   // 正在执行休眠操作的硬盘 id
var REFRESHING = false;

var STATE_LABEL = { active: "运行中", idle: "空闲", standby: "已休眠", sleeping: "深度睡眠", unknown: "未知", error: "查询失败" };
var STATE_TIP = {
  active: "硬盘正在运转",
  idle: "磁头已停泊或低转速运转，尚未进入休眠",
  standby: "硬盘已休眠（盘片停转）",
  sleeping: "硬盘处于深度睡眠",
  unknown: "该硬盘无法查询电源状态，但不影响发送休眠指令",
  error: "状态查询失败"
};
var TRANSPORT_LABEL = { sata: "SATA", usb: "USB", sas: "SAS", scsi: "SCSI", ata: "ATA", nvme: "NVMe" };

var ICON_DISK = '<svg viewBox="0 0 24 24"><line x1="22" y1="12" x2="2" y2="12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/><line x1="6" y1="16" x2="6.01" y2="16"/><line x1="10" y1="16" x2="10.01" y2="16"/></svg>';
var ICON_MOON = '<svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
var ICON_EMPTY = '<svg viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>';

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

function formatBytes(n) {
  n = Number(n);
  if (!n || n <= 0) return "—";
  var v = n / Math.pow(1024, 4), u = 0;
  var units = ["TB", "GB", "MB", "KB", "B"];
  while (v < 1 && u < units.length - 1) { v *= 1024; u++; }
  return v.toFixed(v >= 100 ? 0 : v >= 10 ? 1 : 2) + " " + units[u];
}

/* ---------------- Toast ---------------- */
var toastTimer = null;
function toast(msg, type) {
  var el = document.getElementById("toast");
  document.getElementById("toastText").textContent = msg;
  el.className = "show t-" + (type || "info");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.className = "t-" + (type || "info"); }, 4200);
}

/* ---------------- 渲染 ---------------- */
function renderSummary() {
  var total = DISKS.length;
  var active = 0, idle = 0, standby = 0;
  DISKS.forEach(function (d) {
    if (d.state === "active") active++;
    if (d.state === "idle") idle++;
    if (d.state === "standby" || d.state === "sleeping") standby++;
  });
  var other = total - active - idle - standby;
  var html = '<span class="chip"><span class="dot dot-all"></span>全部 <b>' + total + '</b></span>';
  if (total > 0) {
    html += '<span class="chip"><span class="dot dot-ok"></span>运行中 <b>' + active + '</b></span>';
    if (idle > 0) html += '<span class="chip"><span class="dot"></span>空闲 <b>' + idle + '</b></span>';
    html += '<span class="chip"><span class="dot dot-st"></span>已休眠 <b>' + standby + '</b></span>';
    if (other > 0) html += '<span class="chip"><span class="dot"></span>其他 / 未知 <b>' + other + '</b></span>';
  }
  document.getElementById("summary").innerHTML = html;
}

function cardHtml(d, idx) {
  var state = d.state || "unknown";
  var label = STATE_LABEL[state] || "未知";
  var model = d.model || ("硬盘 " + (d.path || ""));
  var tran = TRANSPORT_LABEL[d.transport] || (d.transport ? d.transport.toUpperCase() : "—");
  var kind = d.rotational ? "HDD 机械盘" : "SSD 固态盘";
  var busy = !!BUSY[d.id];
  var asleep = d.state === "standby" || d.state === "sleeping";

  var subTags = '<span class="mono">' + esc(d.path) + "</span>" +
    '<span class="tag tag-blue">' + esc(tran) + "</span>" +
    '<span class="tag">' + esc(kind) + "</span>";
  if (d.is_system) subTags += '<span class="tag tag-warn">系统盘</span>';

  var serial = d.serial ? '<span class="mono">' + esc(d.serial) + "</span>" : "—";

  var mountsHtml = "";
  if (d.mountpoints && d.mountpoints.length) {
    var chips = d.mountpoints.slice(0, 8).map(function (m) {
      return '<span class="mount" title="' + esc(m) + '">' + esc(m) + "</span>";
    }).join("");
    if (d.mountpoints.length > 8) chips += '<span class="mount">+' + (d.mountpoints.length - 8) + "</span>";
    mountsHtml = '<div class="spec full"><div class="k">挂载点</div><div class="mounts">' + chips + "</div></div>";
  }

  var detailHtml = "";
  if (d.state_detail) {
    detailHtml = '<div class="detail">' + esc(d.state_detail) + "</div>";
  }
  var lastSleepHtml = "";
  if (d.last_sleep) {
    lastSleepHtml = '<div class="spec full"><div class="k">上次休眠指令</div><div class="v">' +
      esc(d.last_sleep.time) + (d.last_sleep.ok ? " · 已成功发送" : " · 发送失败") + "</div></div>";
  }

  var btn;
  if (busy) {
    btn = '<button class="btn-sleep loading" disabled><span class="spinner"></span>正在发送休眠指令…</button>';
  } else if (asleep) {
    btn = '<button class="btn-sleep" disabled>' + ICON_MOON + (d.state === "sleeping" ? "已深度睡眠" : "已休眠") + "</button>";
  } else {
    btn = '<button class="btn-sleep" onclick="sleepDisk(\'' + esc(d.id).replace(/'/g, "\\'") + '\')">' + ICON_MOON + "立即休眠</button>";
  }

  return '<div class="card" style="animation-delay:' + ((idx || 0) * 70) + 'ms">' +
    '<div class="card-head">' +
      '<div class="disk-icon s-' + state + '">' + ICON_DISK + "</div>" +
      '<div class="disk-title">' +
        '<div class="model" title="' + esc(model) + '">' + esc(model) + "</div>" +
        '<div class="model-sub">' + subTags + "</div>" +
      "</div>" +
      '<span class="pill p-' + state + '" title="' + esc(STATE_TIP[state] || label) + '"><span class="dot"></span>' + label + "</span>" +
    "</div>" +
    '<div class="specs">' +
      '<div class="spec"><div class="k">容量</div><div class="v">' + formatBytes(d.size_bytes) + "</div></div>" +
      '<div class="spec"><div class="k">序列号</div><div class="v" title="' + esc(d.serial || "") + '">' + serial + "</div></div>" +
      mountsHtml +
      lastSleepHtml +
    "</div>" +
    detailHtml +
    btn +
  "</div>";
}

function renderSkeleton(n) {
  var html = "";
  for (var i = 0; i < n; i++) html += '<div class="skeleton"></div>';
  document.getElementById("grid").innerHTML = html;
}

function render() {
  var grid = document.getElementById("grid");
  renderSummary();
  if (!DISKS.length) {
    grid.innerHTML = '<div class="empty">' + ICON_EMPTY + "<div>未检测到支持休眠的硬盘（SATA / USB）</div></div>";
    return;
  }
  var html = "";
  DISKS.forEach(function (d, i) { html += cardHtml(d, i); });
  grid.innerHTML = html;
}

function setUpdated() {
  var now = new Date();
  var pad = function (x) { return (x < 10 ? "0" : "") + x; };
  document.getElementById("updated").textContent =
    "更新于 " + pad(now.getHours()) + ":" + pad(now.getMinutes()) + ":" + pad(now.getSeconds());
}

function showBanner(msg) {
  document.getElementById("errorText").textContent = msg;
  document.getElementById("errorBanner").style.display = "flex";
}
function hideBanner() {
  document.getElementById("errorBanner").style.display = "none";
}

/* ---------------- 数据加载 ---------------- */
function refresh() {
  if (REFRESHING) return;
  REFRESHING = true;
  document.getElementById("refreshBtn").classList.add("spinning");
  fetch("/api/disks", { cache: "no-store" })
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (!data.ok) throw new Error(data.error || "加载失败");
      DISKS = data.disks || [];
      hideBanner();
      render();
      setUpdated();
    })
    .catch(function (e) {
      showBanner("无法获取硬盘列表：" + e.message + "，请确认应用服务正在运行后点击“刷新状态”重试");
    })
    .finally(function () {
      REFRESHING = false;
      document.getElementById("refreshBtn").classList.remove("spinning");
    });
}

/* ---------------- 休眠操作 ---------------- */
function sleepDisk(id) {
  if (BUSY[id]) return;
  var d = DISKS.find(function (x) { return x.id === id; });
  if (!d) return;

  if (d.is_system) {
    var ok = confirm("该硬盘包含系统分区，休眠后系统需要访问时会被自动唤醒，期间可能出现短暂卡顿。\n\n确定要让 " + (d.path || "") + " 进入休眠吗？");
    if (!ok) return;
  }

  BUSY[id] = true;
  render();

  fetch("/api/sleep", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ id: id })
  })
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (data.disk) {
        var i = DISKS.findIndex(function (x) { return x.id === id; });
        if (i >= 0) DISKS[i] = data.disk;
      }
      toast(data.message || (data.ok ? "操作完成" : "操作失败"), data.level || (data.ok ? "success" : "error"));
    })
    .catch(function (e) {
      toast("请求失败：" + e.message, "error");
    })
    .finally(function () {
      delete BUSY[id];
      render();
      setUpdated();
    });
}

/* ---------------- 初始化 ---------------- */
// 从后端读取版本号并更新界面显示（保持与实际安装版本一致）
(function loadVersion() {
  fetch("/api/about", { cache: "no-store" })
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (data.ok && data.version) {
        var v = "V" + data.version;
        document.getElementById("verBadge").textContent = v;
        document.getElementById("verFooter").textContent = "DiskHibeY " + v;
      }
    })
    .catch(function () {});
})();

renderSkeleton(4);
renderSummary();
refresh();
</script>
